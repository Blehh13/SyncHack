openapi: 3.1.0

info:
  title: SyncFlow API
  version: 0.1.0
  description: |
    SyncFlow is a hackathon/event management platform.
    This OpenAPI document is the **contract of record** for the entire API surface.
    All implementations must match this specification.
    Contract tests (Schemathesis) run against this file on every CI run.

servers:
  - url: /api/v1
    description: SyncFlow API v1

components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      description: |
        Server-issued session token obtained from POST /auth/login or POST /auth/register.
        Pass as: Authorization: Bearer <token>

  schemas:

    # ── Enums ──────────────────────────────
    UserRole:
      type: string
      enum: [PARTICIPANT, ORGANIZER, JUDGE, ADMIN]

    EventStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ONGOING, COMPLETED, CANCELLED]

    RegistrationStatus:
      type: string
      enum: [CONFIRMED, WITHDRAWN]

    TeamState:
      type: string
      enum: [FORMING, LOCKED]

    SubmissionStatus:
      type: string
      enum: [DRAFT, SUBMITTED, UNDER_REVIEW, EVALUATED]

    # ── Entities ───────────────────────────
    User:
      type: object
      required: [id, name, email, role, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Event:
      type: object
      required:
        - id
        - name
        - slug
        - organizerId
        - startDate
        - endDate
        - registrationDeadline
        - submissionDeadline
        - teamMinSize
        - teamMaxSize
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          pattern: '^[a-z0-9-]{3,60}$'
        description:
          type: string
          nullable: true
        organizerId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        registrationDeadline:
          type: string
          format: date-time
        submissionDeadline:
          type: string
          format: date-time
        teamMinSize:
          type: integer
          minimum: 1
          default: 2
        teamMaxSize:
          type: integer
          minimum: 1
          default: 4
        status:
          $ref: '#/components/schemas/EventStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Registration:
      type: object
      required: [id, userId, eventId, status, registeredAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RegistrationStatus'
        registeredAt:
          type: string
          format: date-time

    Team:
      type: object
      required: [id, eventId, name, leaderId, state, memberCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        leaderId:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/TeamState'
        memberCount:
          type: integer
          minimum: 1
          description: Computed — current number of members
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
          description: Included when fetching a single team
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TeamMember:
      type: object
      required: [id, teamId, userId, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        joinedAt:
          type: string
          format: date-time

    Submission:
      type: object
      required: [id, teamId, projectName, description, repositoryUrl, status, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        projectName:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          minLength: 1
          maxLength: 5000
        repositoryUrl:
          type: string
          format: uri
        demoUrl:
          type: string
          format: uri
          nullable: true
          description: Optional. Subject to removal in CHANGE-004.
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        submittedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time

    JudgeAssignment:
      type: object
      required: [id, judgeId, submissionId, assignedAt]
      properties:
        id:
          type: string
          format: uuid
        judgeId:
          type: string
          format: uuid
        submissionId:
          type: string
          format: uuid
        assignedAt:
          type: string
          format: date-time

    Evaluation:
      type: object
      required:
        - id
        - submissionId
        - judgeId
        - innovationScore
        - technicalScore
        - designScore
        - impactScore
        - submittedAt
      properties:
        id:
          type: string
          format: uuid
        submissionId:
          type: string
          format: uuid
        judgeId:
          type: string
          format: uuid
        innovationScore:
          type: integer
          minimum: 0
          maximum: 10
          description: |
            BASELINE: 0–10.
            CHANGE-005 will raise this to 0–20. This constraint is the primary
            signal Thally uses to identify documentation drift.
        technicalScore:
          type: integer
          minimum: 0
          maximum: 10
          description: BASELINE 0–10. Subject to CHANGE-005 (0–20).
        designScore:
          type: integer
          minimum: 0
          maximum: 10
        impactScore:
          type: integer
          minimum: 0
          maximum: 10
        feedback:
          type: string
          maxLength: 2000
          nullable: true
          description: Optional written feedback. Subject to removal in CHANGE-008.
        submittedAt:
          type: string
          format: date-time
          description: Immutable after creation. No PATCH on Evaluation in MVP.

    ListMeta:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
          description: MVP default 200 — no pagination

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: TEAM_FULL
            message:
              type: string
            field:
              type: string
              nullable: true

    # ── Request Bodies ──────────────────────
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    CreateEventRequest:
      type: object
      required: [name, slug, startDate, endDate, registrationDeadline, submissionDeadline, teamMinSize, teamMaxSize]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          pattern: '^[a-z0-9-]{3,60}$'
        description:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        registrationDeadline:
          type: string
          format: date-time
        submissionDeadline:
          type: string
          format: date-time
        teamMinSize:
          type: integer
          minimum: 1
          default: 2
        teamMaxSize:
          type: integer
          minimum: 1
          default: 4

    UpdateEventRequest:
      type: object
      description: |
        name, description — editable in any non-CANCELLED status.
        Date fields — editable in DRAFT only (DEC-E005).
        teamMinSize, teamMaxSize — editable in DRAFT and PUBLISHED, subject to BR-011.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        registrationDeadline:
          type: string
          format: date-time
        submissionDeadline:
          type: string
          format: date-time
        teamMinSize:
          type: integer
          minimum: 1
        teamMaxSize:
          type: integer
          minimum: 1

    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    CreateSubmissionRequest:
      type: object
      required: [projectName, description, repositoryUrl]
      properties:
        projectName:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          minLength: 1
          maxLength: 5000
        repositoryUrl:
          type: string
          format: uri
        demoUrl:
          type: string
          format: uri
          nullable: true

    UpdateSubmissionRequest:
      type: object
      properties:
        projectName:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          minLength: 1
          maxLength: 5000
        repositoryUrl:
          type: string
          format: uri
        demoUrl:
          type: string
          format: uri
          nullable: true

    AssignJudgeRequest:
      type: object
      required: [judgeId]
      properties:
        judgeId:
          type: string
          format: uuid

    CreateEvaluationRequest:
      type: object
      required: [innovationScore, technicalScore, designScore, impactScore]
      properties:
        innovationScore:
          type: integer
          minimum: 0
          maximum: 10
        technicalScore:
          type: integer
          minimum: 0
          maximum: 10
        designScore:
          type: integer
          minimum: 0
          maximum: 10
        impactScore:
          type: integer
          minimum: 0
          maximum: 10
        feedback:
          type: string
          maxLength: 2000
          nullable: true

    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/UserRole'

    ReassignLeaderRequest:
      type: object
      required: [newLeaderId]
      properties:
        newLeaderId:
          type: string
          format: uuid

  responses:
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: SESSION_EXPIRED, message: Your session has expired., field: null}
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: FORBIDDEN, message: You do not have permission., field: null}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: RESOURCE_NOT_FOUND, message: The requested resource does not exist., field: null}
    ValidationError:
      description: Input validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: RATE_LIMITED, message: Too many attempts. Try again in 15 minutes., field: null}

paths:

  /auth/register:
    post:
      operationId: registerAccount
      summary: Create account (AUTH-001)
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; session issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: {$ref: '#/components/schemas/User'}
                      token: {type: string}
        '409':
          description: Duplicate email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: DUPLICATE_EMAIL, message: An account with this email already exists., field: email}
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      operationId: login
      summary: Authenticate (AUTH-002)
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: {$ref: '#/components/schemas/User'}
                      token: {type: string}
        '401':
          description: Invalid credentials or inactive account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Current user (AUTH-003)
      tags: [Auth]
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/User'}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      operationId: logout
      summary: Invalidate session (AUTH-003)
      tags: [Auth]
      security:
        - sessionAuth: []
      responses:
        '204':
          description: Session invalidated
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/{userId}/role:
    patch:
      operationId: changeUserRole
      summary: Change user role — ADMIN only (AUTH-004)
      tags: [Users]
      security:
        - sessionAuth: []
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: Invalid role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: INVALID_ROLE, message: The role value is not valid., field: role}

  /users/{userId}/deactivate:
    patch:
      operationId: deactivateUser
      summary: Deactivate user — ADMIN only (ADMIN-002)
      tags: [Users]
      security:
        - sessionAuth: []
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: User deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /events:
    get:
      operationId: listEvents
      summary: List events (EVENT-005)
      tags: [Events]
      security: []
      description: |
        Public: PUBLISHED, ONGOING, COMPLETED events.
        ORGANIZER/ADMIN with ?owned=true&status=DRAFT: own DRAFT events.
      parameters:
        - {name: owned, in: query, schema: {type: boolean}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/EventStatus'}}
      responses:
        '200':
          description: Event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Event'}
                  meta: {$ref: '#/components/schemas/ListMeta'}
    post:
      operationId: createEvent
      summary: Create event — ORGANIZER/ADMIN (EVENT-001)
      tags: [Events]
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Event created (status=DRAFT, BR-014)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Event'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Slug taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: SLUG_TAKEN, message: This slug is already in use., field: slug}
        '422': {$ref: '#/components/responses/ValidationError'}

  /events/{eventId}:
    get:
      operationId: getEvent
      summary: Event detail (EVENT-005)
      tags: [Events]
      security: []
      description: DRAFT events visible only to owner/ADMIN.
      parameters:
        - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Event'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateEvent
      summary: Update event — owner ORGANIZER/ADMIN (EVENT-003)
      tags: [Events]
      security:
        - sessionAuth: []
      parameters:
        - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Event'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: teamMaxSize conflict (BR-011)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: TEAM_SIZE_CONFLICT, message: teamMaxSize cannot be lower than the largest existing team., field: teamMaxSize}
        '422': {$ref: '#/components/responses/ValidationError'}

  /events/{eventId}/publish:
    post:
      operationId: publishEvent
      summary: Publish event — DRAFT to PUBLISHED (EVENT-002)
      tags: [Events]
      security:
        - sessionAuth: []
      parameters:
        - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Event published
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Event'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Already published or invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Event incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: EVENT_INCOMPLETE, message: All required fields must be set before publishing., field: null}

  /events/{eventId}/registrations:
    post:
      operationId: registerForEvent
      summary: Register for event (REG-001)
      tags: [Registrations]
      security:
        - sessionAuth: []
      parameters:
        - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '201':
          description: Registered (status=CONFIRMED)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Registration'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: Event not published, closed, or cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: DUPLICATE_REGISTRATION, message: You are already registered., field: null}
    get:
      operationId: listRegistrations
      summary: List registrations — owner ORGANIZER/ADMIN
      tags: [Registrations]
      security:
        - sessionAuth: []
      parameters:
        - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Registration list (max 200, MVP)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Registration'}
                  meta: {$ref: '#/components/schemas/ListMeta'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /events/{eventId}/teams:
    post:
      operationId: createTeam
      summary: Create team (TEAM-001)
      tags: [Teams]
      security:
        - sessionAuth: []
      parameters:
        - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Team created; caller is leader and first member
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Team'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: Not registered for event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: NOT_REGISTERED, message: You must register before creating a team., field: null}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Already in team or name taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /teams/{teamId}:
    get:
      operationId: getTeam
      summary: Team detail with members (TEAM-001)
      tags: [Teams]
      security:
        - sessionAuth: []
      parameters:
        - {name: teamId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Team with members array
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Team'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /teams/{teamId}/members:
    post:
      operationId: joinTeam
      summary: Join a team (TEAM-002)
      tags: [Teams]
      security:
        - sessionAuth: []
      description: Caller must be registered for the team's event and not already on a team.
      parameters:
        - {name: teamId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '201':
          description: Joined team
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/TeamMember'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: Not registered for event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: NOT_REGISTERED, message: Register for this event first., field: null}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Team full, already in team, or team locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /teams/{teamId}/members/{userId}:
    delete:
      operationId: removeTeamMember
      summary: Remove team member (TEAM-006)
      tags: [Teams]
      security:
        - sessionAuth: []
      description: Leader removes non-leader member. Cannot remove leader without reassigning first.
      parameters:
        - {name: teamId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description: Member removed
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Cannot remove leader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: CANNOT_REMOVE_LEADER, message: Reassign leadership before removing this member., field: null}

  /teams/{teamId}/leader:
    patch:
      operationId: reassignLeader
      summary: Reassign team leader (WP-6 — leader departure)
      tags: [Teams]
      security:
        - sessionAuth: []
      description: |
        Required before a leader can withdraw registration or be removed.
        New leader must already be a TeamMember.
        Callable by: current leader, event organizer (owner), ADMIN.
      parameters:
        - {name: teamId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignLeaderRequest'
      responses:
        '200':
          description: Leadership reassigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Team'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: New leader is not a team member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: VALIDATION_FAILED, message: The specified user is not a member of this team., field: newLeaderId}

  /teams/{teamId}/submission:
    post:
      operationId: createSubmission
      summary: Create DRAFT submission (SUB-001)
      tags: [Submissions]
      security:
        - sessionAuth: []
      description: |
        Leader only (BR-003). One per team (BR-006). Before deadline (BR-005).
        Creates submission in DRAFT. Locks the team (FORMING→LOCKED).
      parameters:
        - {name: teamId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionRequest'
      responses:
        '201':
          description: DRAFT submission created; team now LOCKED
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Submission'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: Not leader or deadline passed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Team already has submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: ALREADY_SUBMITTED, message: This team already has a submission., field: null}
    get:
      operationId: getSubmission
      summary: Get team submission (SUB-001)
      tags: [Submissions]
      security:
        - sessionAuth: []
      parameters:
        - {name: teamId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Submission detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Submission'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /submissions/{submissionId}:
    patch:
      operationId: updateSubmission
      summary: Update DRAFT submission (SUB-004)
      tags: [Submissions]
      security:
        - sessionAuth: []
      description: Leader only. DRAFT status only. Before deadline only.
      parameters:
        - {name: submissionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubmissionRequest'
      responses:
        '200':
          description: Submission updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Submission'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: Not leader, already locked, or deadline passed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /submissions/{submissionId}/submit:
    post:
      operationId: finalizeSubmission
      summary: Finalize submission — DRAFT to SUBMITTED (SUB-005)
      tags: [Submissions]
      security:
        - sessionAuth: []
      description: Irreversible in MVP. Leader only. Before deadline.
      parameters:
        - {name: submissionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Submission finalized; status=SUBMITTED
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Submission'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: Not leader or deadline passed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Already submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: ALREADY_SUBMITTED, message: This submission is already finalized., field: null}

  /submissions/{submissionId}/assignments:
    post:
      operationId: assignJudge
      summary: Assign judge (JUDGE-001)
      tags: [Judging]
      security:
        - sessionAuth: []
      description: |
        Owner ORGANIZER or ADMIN (BR-008).
        Target must have role=JUDGE. Judge must not be in the team (BR-007).
        First assignment → submission transitions to UNDER_REVIEW.
      parameters:
        - {name: submissionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignJudgeRequest'
      responses:
        '201':
          description: Judge assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/JudgeAssignment'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Conflict of interest or already assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Target not a JUDGE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: INVALID_JUDGE_ROLE, message: The specified user does not have the JUDGE role., field: judgeId}

  /submissions/{submissionId}/evaluation:
    post:
      operationId: createEvaluation
      summary: Submit evaluation (JUDGE-002)
      tags: [Judging]
      security:
        - sessionAuth: []
      description: |
        Assigned JUDGE only. One per (judge, submission). Immutable after creation.
        Scores 0–10 per criterion (BASELINE — CHANGE-005 raises innovation+technical to 0–20).
        When all assigned judges evaluate, submission → EVALUATED.
      parameters:
        - {name: submissionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvaluationRequest'
      responses:
        '201':
          description: Evaluation submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Evaluation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: Not assigned judge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: FORBIDDEN, message: You are not assigned to judge this submission., field: null}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Already evaluated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: ALREADY_EVALUATED, message: You have already submitted an evaluation., field: null}
        '422':
          description: Score out of range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: INVALID_SCORE, message: Each score must be between 0 and 10., field: innovationScore}

  /submissions/{submissionId}/evaluations:
    get:
      operationId: listEvaluations
      summary: List evaluations — ORGANIZER/ADMIN (JUDGE-002)
      tags: [Judging]
      security:
        - sessionAuth: []
      parameters:
        - {name: submissionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Evaluation list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Evaluation'}
                  meta: {$ref: '#/components/schemas/ListMeta'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

tags:
  - {name: Auth, description: Authentication — AUTH-001 through AUTH-004}
  - {name: Users, description: User management — ADMIN-001 ADMIN-002}
  - {name: Events, description: Event lifecycle — EVENT-001 through EVENT-005}
  - {name: Registrations, description: Registration — REG-001 through REG-003}
  - {name: Teams, description: Team management — TEAM-001 through TEAM-006}
  - {name: Submissions, description: Submission lifecycle — SUB-001 through SUB-005}
  - {name: Judging, description: Judge assignment and evaluation — JUDGE-001 through JUDGE-004}
